<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Button Trigger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #responseText {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>FastAPI Backend Trigger</h1>
    <p>Click the button below to execute the Python script on the server.</p>
    
    <!-- The physical button -->
    <button id="actionBtn">Run Python Logic</button>
    
    <!-- Element where the backend message will show up -->
    <p id="responseText"></p>

    <script>
        // Listen for the button click
        document.getElementById('actionBtn').addEventListener('click', async () => {
            const responseText = document.getElementById('responseText');
            responseText.style.color = "#333";
            responseText.innerText = "Processing request on backend...";
            
            try {
                // Send a POST request to the FastAPI endpoint
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                // Parse the JSON data sent back from main.py
                const data = await response.json();
                
                // Display the success message on the page
                responseText.style.color = "green";
                responseText.innerText = data.message;
                
            } catch (error) {
                // Handle connection errors if the server is down
                responseText.style.color = "red";
                responseText.innerText = "Error: Could not connect to the backend server.";
                console.error("Fetch error:", error);
            }
        });
    </script>

</body>
</html>
